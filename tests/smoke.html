<!doctype html><meta charset="utf-8"><pre id="log"></pre>
<!-- Smoke test: loads ../index.html in an iframe and reports what is on screen.
     smoke.html#hosted  should show the sign-in screen
     smoke.html#local   local-only mode, plays 1.e4 in Build
     smoke.html#train   local-only mode, builds 1.e4 e5 2.Nf3, then trains both cards: each is
                        answered wrongly once, comes back later in the session, then is answered right
     Clears localStorage for the file:// origin, so run it in a throwaway browser profile. -->
<script>
const L = m => document.getElementById("log").textContent += m + "\n";
window.onerror = (m, s, l) => L("ERR " + m + " @" + s + ":" + l);
window.addEventListener("unhandledrejection", e => L("REJ " + (e.reason && e.reason.stack || e.reason)));
const mode = location.hash.slice(1);
localStorage.clear(); if (mode !== "hosted") localStorage.setItem("pb_local_only", "true");
const f = document.createElement("iframe"); f.style.width = "400px"; f.style.height = "800px"; f.src = "../index.html"; document.body.append(f);
f.onload = () => {
  const w = f.contentWindow, d = f.contentDocument;
  const G = name => w.eval(name); // top-level const globals aren't window properties
  w.onerror = (m, s, l) => L("APPERR " + m + " @" + s + ":" + l);
  w.addEventListener("unhandledrejection", e => L("APPREJ " + (e.reason && e.reason.stack || e.reason)));
  const play = (board, from, to) => { d.querySelector(`${board} [data-sq="${from}"]`).click(); d.querySelector(`${board} [data-sq="${to}"]`).click(); };
  setTimeout(() => {
    const vis = s => { const e = d.querySelector(s); return e ? (e.hidden ? "hidden" : "shown") : "missing"; };
    L("loading=" + vis("#loading") + " auth=" + vis("#authView") + " tabs=" + vis(".tabs") + " build=" + vis('[data-view="build"]'));
    L("storeMode=" + G("S").storeMode + " squares=" + d.querySelectorAll("#board .sq").length + " pieces=" + d.querySelectorAll("#board .pc").length);
    if (mode === "local") {
      play("#board", "e2", "e4");
      L("after e4: path=" + G("S").build.white.join(" ") + " cards=" + Object.keys(G("S").rep.white.cards).length + " name=" + d.querySelector("#opName").textContent);
      d.querySelector('[data-nav="train"]').click();
      L("train tiles: " + d.querySelector("#tStats").textContent.replace(/\s+/g, " ").trim());
      d.querySelector('[data-nav="settings"]').click();
      L("settings: " + d.querySelector("#repCounts").textContent);
      L("DONE");
    }
    if (mode === "train") runTrain();
    if (mode === "multi") runMulti();
    if (mode === "explore") runExplore();
    if (mode === "books") runBooks();
    if (mode === "anim") runAnim();
    if (mode === "lines") runLines();
    if (mode === "explore-mode") runExploreMode();
    if (mode === "focus") (async () => {
      // v0.9.24: map, focus on one opening, My lines with a note, routes into a position, spot the difference, Build from here
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const until = async (cond, ms = 15000) => { const t0 = Date.now(); while (!cond() && Date.now() - t0 < ms) await sleep(50); return cond(); };
      w.eval(`S.settings.autoOpp = "off";
        for (const l of ["e4 e5 Nf3 Nc6 Bc4 Bc5 c3", "e4 e5 Nf3 d6 d4", "e4 c5 Nf3 d6 d4", "d4 Nf6 c4 e6"]) { const p = []; for (const m of l.split(" ")) { addMove(p, m, "white"); p.push(m); } }
        walk("white");`);
      d.querySelector('[data-nav="openings"]').click();
      d.querySelector('[data-otab="map"]').click();
      await until(() => d.querySelector("#coverMap .maprow:not(.mhead)"));
      L("map rows: " + [...d.querySelectorAll("#coverMap .maprow:not(.mhead) .mapname")].map(b => b.textContent.trim()).join(" | ") + " | cells per row: " + d.querySelectorAll("#coverMap .maprow:not(.mhead)")[0].querySelectorAll(".mc").length);
      L("progress: " + ((d.querySelector("#coverMap .possum") || {}).textContent || "none") + " | hist: " + JSON.stringify(G("S").rep.white.hist.map(h => h.c)));
      d.querySelector('[data-mapmode="res"]').click();
      L("results view: " + d.querySelector("#coverMap .covmap").className);
      d.querySelector('[data-mapmode="played"]').click();
      L("played view: " + d.querySelector("#coverMap .covmap").className + " | end column: " + d.querySelector("#coverMap .mapend").textContent);
      // focus from the catalogue
      d.querySelector('[data-otab="cat"]').click();
      await until(() => d.querySelector("#catBody details.cat"));
      L("catalogue: " + d.querySelector(".cathead").textContent.replace(/\s+/g, " ").trim() + " | " + [...d.querySelectorAll("#catBody > details.cat > summary")].map(s => s.textContent.replace(/\s+/g, " ").trim()).join(" | "));
      const it = [...d.querySelectorAll("#catBody details.cat")].find(x => /Italian/.test(x.querySelector(".catname").textContent));
      it.querySelector("[data-focusbuild]").click(); await sleep(50);
      L("focus bar on Moves: " + !!d.querySelector("#prompt .focusbar") + " | tabs: " + [...d.querySelectorAll("[data-ptab]")].map(b => b.textContent).join(", "));
      d.querySelector('[data-ptab="tree"]').click(); await sleep(50);
      L("focus bar on My lines: " + d.querySelector("#treeCard .focusbar").textContent.replace(/\s+/g, " ").trim());
      d.querySelector('[data-ptab="moves"]').click();
      d.querySelector("#fwd").click(); d.querySelector("#fwd").click(); await sleep(50);
      d.querySelector("#toStart").click();
      L("⏮ goes to: " + G("S").build.white.join(" ") + " | then: " + (d.querySelector("#toStart").click(), G("S").build.white.join(" ") || "start"));
      // My lines and a note
      w.eval('S.build.white = ["e4","e5"]; renderBuild()');
      d.querySelector('[data-ptab="tree"]').click(); await sleep(50);
      L("my lines: " + d.querySelector("#treeCard .tree").textContent.replace(/\s+/g, " ").trim());
      const ta = d.querySelector("#tNote"); ta.value = "Play for d4"; ta.dispatchEvent(new w.Event("input"));
      L("note saved: " + G("S").rep.white.notes[G('K(fenAfter(START, ["e4","e5"]))')]);
      d.querySelector('#treeCard [data-tgo="e4 e5 Nf3 d6 d4"]').click(); await sleep(50);
      L("tap a move goes to: " + G("S").build.white.join(" "));
      d.querySelector('[data-ptab="moves"]').click();
      w.eval('S.build.white = ["e4","e5"]; renderBuild()');
      L("Moves tab stays clean: " + !d.querySelector("#prompt .notel, #prompt .trbox, #prompt .focusbar"));
      // routes into a position from another line: 1.c4 e6 2.Nc3 Nf6 3.d4 = 1.d4 Nf6 2.c4 e6 3.Nc3
      w.eval('S.build.white = "c4 e6 Nc3 Nf6 d4".split(" "); S.ptab = "tree"; renderBuild()');
      await until(() => d.querySelector("#treeCard .trbox"), 3000);
      L("routes: " + ((d.querySelector("#treeCard .trlist") || {}).textContent || "none").replace(/\s+/g, " ").trim());
      d.querySelector("#treeCard [data-tradd='0']").click(); await sleep(50);
      L("after Add: Nc3 saved=" + G('rep("white").pos[K(fenAfter(START, "d4 Nf6 c4 e6".split(" ")))].m.join(",")') + " | " + ((d.querySelector("#treeCard [data-undo='tr']") || {}).parentNode || { textContent: "no undo" }).textContent.replace(/\s+/g, " ").trim());
      // spot the difference
      d.querySelector('[data-nav="train"]').click(); await sleep(50);
      L("focus on Train: " + d.querySelector("#focusTrain").textContent.replace(/\s+/g, " ").trim());
      d.querySelector("#focusTrain [data-focusclear]").click(); await sleep(50);
      L("cleared: " + (d.querySelector("#focusTrain").textContent.trim() || "no bar") + " | sim: " + d.querySelector("#simInfo").textContent);
      d.querySelector("#simStart").click(); await sleep(50);
      L("sim session: queue=" + G("T").queue.length + " | " + d.querySelector("#tProgress").textContent);
      d.querySelector("#tStop").click(); await sleep(50);
      // a practised line ends: Build from here
      w.eval('setFocus(["e4","e5","Nf3","d6"]); startLines()');
      await until(() => d.querySelector("#tPrompt [data-linebuild]") || (G("T").phase === "move" && (play("#tBoard", "d2", "d4"), false)), 8000);
      const lb = d.querySelector("#tPrompt [data-linebuild]");
      if (lb) { lb.click(); await sleep(50); }
      L("Build from here: view=" + G("S").view + " path=" + G("S").build.white.join(" "));
      L("DONE");
    })();
    if (mode === "connect") (async () => {
      // v0.9.27: Openings > Connect, one chain at a time; Gap › replays the line; Build rows go deep at once
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const until = async (cond, ms = 15000) => { const t0 = Date.now(); while (!cond() && Date.now() - t0 < ms) await sleep(50); return cond(); };
      w.eval(`S.settings.autoOpp = "off";
        for (const l of ["d4 Nf6 c4 e6 Nc3 Bb4 Qc2", "c4 Nf6 g3", "e4 e5 Nf3 Nc6 Bc4"]) { const p = []; for (const m of l.split(" ")) { addMove(p, m, "white"); p.push(m); } }
        walk("white");`);
      d.querySelector('[data-nav="openings"]').click();
      L("tabs: " + [...d.querySelectorAll("[data-otab]")].map(b => b.textContent).join(", "));
      // the slow asm.js engine (no WASM from file://) would take minutes: even evals, at once
      w.eval('Engine.analyse = (fen, depth) => { const e = { cp: 0, d: depth }; EVALC[K(fen)] = e; return Promise.resolve(e); }');
      d.querySelector('[data-otab="connect"]').click();
      L("while checking: " + d.querySelector("#connectPane").textContent.replace(/\s+/g, " ").trim().slice(-160));
      await until(() => d.querySelector("#connectPane [data-conact]"), 40000);
      L("state: " + w.eval('JSON.stringify({ running: CON.running, verifying: CON.verifying, phase: CON.vPhase, done: CON.vDone, total: CON.vTotal, v: CON.vlist.length, engine: Engine.which || null, failed: !!Engine.failed })'));
      L("connect: " + ((d.querySelector("#connectPane .conhead") || {}).textContent || "none").replace(/\s+/g, " ").trim() + " | " + ((d.querySelector("#connectPane .conbody") || {}).textContent || "").replace(/\s+/g, " ").trim().slice(0, 260));
      L("board pieces: " + d.querySelectorAll("#conBoard .pc").length + " | arrows: " + [...d.querySelectorAll("#conBoard .arw")].map(a => a.getAttribute("class").replace("arw ", "")).join(",") + " | key: " + d.querySelector("#conKey").textContent);
      L("options: " + [...d.querySelectorAll("#connectPane .conopt")].map(b => b.textContent.replace(/\s+/g, " ").trim() + (b.getAttribute("aria-pressed") === "true" ? " *" : "")).join(" || "));
      const o2 = d.querySelectorAll("#connectPane .conopt")[1]; if (o2) { o2.click(); await sleep(50); L("picked 2nd: " + G("CON").selId + " pressed=" + d.querySelectorAll("#connectPane .conopt")[1].getAttribute("aria-pressed")); d.querySelectorAll("#connectPane .conopt")[0].click(); await sleep(50); }
      L("filter: " + [...d.querySelectorAll("#connectPane [data-conmin]")].map(b => b.textContent + (b.getAttribute("aria-pressed") === "true" ? "*" : "")).join(" "));
      d.querySelector("#connectPane [data-conmin=\"0.5\"]").click(); await sleep(50);
      L("at 50%: " + G("S").settings.conMin + " " + ((d.querySelector("#connectPane .conhead") || {}).textContent || "none").replace(/\s+/g, " ").trim());
      d.querySelector("#connectPane [data-conmin=\"0.25\"]").click(); await sleep(50);
      const st = d.querySelector("#connectPane [data-constep='1']"); if (st) { st.click(); await sleep(50); }
      L("acts: " + [...d.querySelectorAll("#connectPane [data-conact]")].map(b => b.textContent).join(", "));
      L("redraw: " + w.eval("(() => { const t0 = performance.now(); for (let i = 0; i < 20; i++) renderConnect(); return Math.round((performance.now() - t0) / 20) + \" ms each\"; })()"));
      // v0.9.29: Open in Build goes to the move shown (step 1 = after the chain's first move), with the next one open
      const cur0 = G("conQueue()")[G("CON").sel];
      d.querySelector('#connectPane [data-conact="build"]').click(); await sleep(50);
      L("Open in Build (step 1 tapped): view=" + G("S").view + " path=" + G("S").build.white.join(" ") + " | chain: " + cur0.path.join(" ") + " | " + cur0.moves.join(" "));
      d.querySelector('[data-nav="openings"]').click(); d.querySelector('[data-otab="connect"]').click(); await until(() => d.querySelector('#connectPane [data-conact="rep:0"]'));
      const rep0b = d.querySelector('#connectPane [data-conact="rep:0"]');
      if (rep0b) { rep0b.click(); await sleep(0); L("straight after Replace: " + ((d.querySelector("#connectPane .conhead") || {}).textContent || d.querySelector("#connectPane").textContent.slice(0, 80)).replace(/\s+/g, " ").trim()); await sleep(1500); }
      L("after Replace: c4 Nf6 -> " + G('(rep("white").pos[K(fenAfter(START, ["c4","Nf6"]))] || {m:[]}).m.join(",")') + " | g3 branch: " + G('!!rep("white").pos[K(fenAfter(START, ["c4","Nf6","g3"]))]') + " | undo: " + !!d.querySelector("#connectPane [data-undo='con']"));
      // the Ideas tab has no Transpositions section any more
      d.querySelector('[data-otab="sug"]').click(); await sleep(50);
      L("ideas tab: " + /Transpositions/.test(d.querySelector("#sugOut").textContent));
      // Gap › replays the line; a tap skips it
      d.querySelector('[data-nav="build"]').click(); await sleep(50);
      w.eval('jumpToGap(rankedGaps()[0].id)');
      L("replay running: " + G("BA").on + " locked=" + G("BB").locked);
      d.querySelector("#board").click(); await sleep(50);
      L("after tap: running=" + G("BA").on + " locked=" + G("BB").locked + " path=" + G("S").build.white.join(" "));
      L("Deeper analysis button: " + !!d.querySelector("#prompt [data-deep]"));
      L("DONE");
    })();
    if (mode === "review") (async () => {
      // v0.9.26: Games > Recent games > a game: accuracy, where I left prep, change my tree
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      w.eval(`S.settings.autoOpp = "off";
        for (const l of ["e4 e5 Nf3 Nc6 Bb5"]) { const p = []; for (const m of l.split(" ")) { addMove(p, m, "white"); p.push(m); } }
        walk("white");
        S.games.push({ id: "rv1", my: "white", tc: "rapid", result: "1-0", date: "2026-11-09", white: "me", black: "them", welo: 1550, belo: 1540, moves: "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6" });
        S.acc.rv1 = { v: 2, d: 10, ev: [20, 30, 25, 30, 30, 10, 15, 20, 18], bm: ["e2e4","e7e5","g1f3","b8c6","f1b5","f8c5","c2c3","g8f6",""], inb: [], post: [], exitCp: 30 };
        touchData(); gameKeys(S.games[S.games.length - 1]);`);
      d.querySelector('[data-nav="games"]').click(); await sleep(50);
      L("list: " + d.querySelector("#gList li").textContent.replace(/\s+/g, " ").trim());
      d.querySelector('#gList [data-review="rv1"]').click(); await sleep(100);
      L("view=" + G("S").view + " | moves: " + [...d.querySelectorAll("#rvLine .mv")].map(b => b.textContent + (b.classList.contains("prep") ? "·p" : "") + (b.classList.contains("dev") ? "·D" : "")).join(" ") + " | arrows: " + d.querySelectorAll("#rvBoard .arw").length);
      L("note: " + d.querySelector("#rvNote").textContent.replace(/\s+/g, " ").trim());
      L("summary: " + d.querySelector("#rvSum").textContent.replace(/\s+/g, " ").trim());
      d.querySelector('#rvNote [data-rvact="replace"]').click(); await sleep(50);
      L("after Make Bc4 my move: " + G('rep("white").pos[K(fenAfter(START, "e4 e5 Nf3 Nc6".split(" ")))].m.join(",")') + " | " + d.querySelector("#rvNote").textContent.replace(/\s+/g, " ").trim().slice(0, 140));
      d.querySelector('#rvNote [data-undo="rev"]').click(); await sleep(50);
      L("after Undo: " + G('rep("white").pos[K(fenAfter(START, "e4 e5 Nf3 Nc6".split(" ")))].m.join(",")'));
      L("misplay note: " + w.eval(`misplayNote(K(fenAfter(START, "e4 e5 Nf3 Nc6".split(" "))))`).replace(/<[^>]+>/g, ""));
      d.querySelector("#rvFwd").click();
      L("▶ goes to ply " + G("RV").i);
      d.querySelector('#rvNote [data-rvbuild]').click(); await sleep(50);
      L("Open in Build: view=" + G("S").view + " path=" + G("S").build.white.join(" "));
      // gap filter buttons
      d.querySelector('[data-nav="settings"]').click(); await sleep(50);
      d.querySelector('[data-gaponly="good"]').click();
      L("gap filter: " + G("S").settings.gapOnly + " pressed=" + d.querySelector('[data-gaponly="good"]').getAttribute("aria-pressed"));
      L("DONE");
    })();
    if (mode === "picture") (async () => {
      // v0.9.35: Openings > Picture: squares, tree, fights, structures, clock
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      w.eval(`S.settings.autoOpp = "off";
        for (const l of ["e4 e5 Nf3 Nc6 Bb5 a6 Ba4", "e4 c5 Nf3 d6 d4 cxd4 Nxd4"]) { const p = []; for (const m of l.split(" ")) { addMove(p, m, "white"); p.push(m); } }
        walk("white");
        const lines = ["e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3 Nb8 d4 Nbd7 Nbd2 Bb7 Bc2 Re8",
                       "e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5 g5 b4",
                       "e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5 Qxd8+ Kxd8 Nc3 Ke8 h3 h5 Rd1 Be7 g4 Nh4"];
        lines.forEach((mv, j) => {
          for (let r = 0; r < 4; r++) {
            const id = "pc" + j + r, n = mv.split(" ").length;
            S.games.push({ id, my: "white", tc: "rapid", tcs: "600+5", result: r % 3 === 0 ? "0-1" : "1-0", date: "2026-11-0" + (r + 1), white: "me", black: "them", moves: mv,
              clk: Array.from({ length: n }, (_, i) => 600 - 12 * Math.floor(i / 2) - (j * 3)) });
            S.acc[id] = { v: 2, d: 10, ev: Array.from({ length: n + 1 }, (_, i) => 20 - (i % 5) * 15 * (j + 1)), bm: [], inb: [], post: [], exitCp: 0 };
          }
        });
        touchData();`);
      d.querySelector('[data-nav="openings"]').click(); await sleep(50);
      d.querySelector('[data-otab="pic"]').click(); await sleep(400);
      const txt = s => (d.querySelector(s) || { textContent: "(missing)" }).textContent.replace(/\s+/g, " ").trim();
      L("tab shown: " + !d.querySelector("#picPane").hidden + " | " + txt("#picPane").slice(0, 80));
      d.querySelector('[data-picview="tree"]').click(); await sleep(50);
      const arcs = d.querySelectorAll("#picPane path.sunarc");
      L("tree: arcs " + arcs.length + ", holes " + d.querySelectorAll("#picPane path.sunarc.gap").length + ", labels " + [...d.querySelectorAll("#picPane text.suntx:not(.core)")].map(t => t.textContent).join(" "));
      d.querySelector('#picPane path[data-picsun="e4 e5"]').dispatchEvent(new w.MouseEvent("click", { bubbles: true })); await sleep(50);
      L("tap e5: " + txt("#picPane .sunsel") + " | board pieces " + d.querySelectorAll("#picBoard .pc").length);
      for (const c of ["peers", "mine"]) { d.querySelector(`[data-pscolor="${c}"]`).click(); await sleep(20); }
      L("colour modes ok, board still there: " + !!d.querySelector("#picBoard .pc"));
      d.querySelector("#picPane [data-picsunin]").click(); await sleep(50);
      L("zoomed: root=" + G("PIC").sun.root.join(" ") + " arcs " + d.querySelectorAll("#picPane path.sunarc").length);
      d.querySelector("#picPane circle.suncore").dispatchEvent(new w.MouseEvent("click", { bubbles: true })); await sleep(50);
      L("back out: root='" + G("PIC").sun.root.join(" ") + "'");
      d.querySelector('[data-picview="structures"]').click(); await sleep(50);
      L("structures: " + [...d.querySelectorAll("#picPane .sttile")].map(t => t.querySelector(".stname").textContent + " (" + t.querySelector(".help").textContent.trim() + ")").join(" | "));
      // the Sicilian game's pawns after move 12: the tile's picture must show them where they are
      const sic = [...d.querySelectorAll("#picPane .sttile")].find(t => /Sicilian/.test(t.textContent));
      if (sic) { const cells = [...sic.querySelectorAll(".pawnb i")]; L("Sicilian tile pawns: white " + cells.map((c, i) => c.classList.contains("w") ? "abcdefgh"[i % 8] + (8 - Math.floor(i / 8)) : "").filter(Boolean).join(" ") + " | black " + cells.map((c, i) => c.classList.contains("b") ? "abcdefgh"[i % 8] + (8 - Math.floor(i / 8)) : "").filter(Boolean).join(" ")); }
      d.querySelector('[data-picview="tree"]').click(); await sleep(50);
      d.querySelector('#picPane path[data-picsun="e4 c5"]').dispatchEvent(new w.MouseEvent("click", { bubbles: true })); await sleep(50);
      d.querySelector('#picPane .sunsel [data-open]').click(); await sleep(50);
      L("Open in Build: view=" + G("S").view + " path=" + G("S").build.white.join(" "));
      L("DONE");
    })();
    if (mode === "catalogue") (async () => {
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      w.eval(`S.settings.autoOpp = "off";
        for (const l of ["e4 e5 Nf3 Nc6 Bc4 Bc5 c3", "e4 e5 Nf3 Nc6 Bb5 a6 Ba4", "e4 c5 Nf3 d6 d4", "e4 e6 d4 d5"]) { const p = []; for (const m of l.split(" ")) { addMove(p, m, "white"); p.push(m); } }
        walk("white");
        S.games = Array.from({ length: 6 }, (_, i) => ({ id: "c" + i, my: "white", tc: "rapid", date: "2026-01-01", result: i < 4 ? "1-0" : "0-1", moves: "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6", white: "me", black: "x" }));
        S.acc = Object.fromEntries(S.games.map(g => [g.id, { v: 2, d: 10, ev: Array(9).fill(20), bm: Array(9).fill(""), inb: [88], post: [70] }]));`);
      d.querySelector('[data-nav="openings"]').click();
      for (let i = 0; i < 50 && !d.querySelector("#catBody details.cat"); i++) await sleep(100);
      L("head: " + d.querySelector("#catHead").textContent);
      L("top entries: " + [...d.querySelectorAll("#catBody > details.cat > summary .catname")].map(s => s.textContent.trim()).join(" | "));
      const it = [...d.querySelectorAll("details.cat")].find(x => /Italian/.test(x.querySelector(".catname").textContent));
      L("Italian summary: " + it.querySelector("summary").textContent.replace(/\s+/g, " ").trim());
      L("Italian comment: " + it.querySelector(".catbody .help").textContent.trim());
      it.open = true; await sleep(50);
      w.eval("renderCatalogue()");
      const again = [...d.querySelectorAll("details.cat")].find(x => /Italian/.test(x.querySelector(".catname").textContent));
      L("stays open after a redraw: " + again.open);
      again.querySelector("[data-focusbuild]").click();
      L("Build opens: view=" + G("S").view + " path=" + G("S").build.white.join(" "));
      d.querySelector('[data-nav="openings"]').click(); await sleep(100);
      const it2 = [...d.querySelectorAll("details.cat")].find(x => /Italian/.test(x.querySelector(".catname").textContent));

  // Practise lines (items 2 and 3): three branches after 1.e4; play 6 lines, getting the first
  // position wrong once; then "Practise from here" in Build starts lines from 1.e4 e5
  async function runLines() {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const build = moves => { d.querySelector("#toStart").click(); for (const [a, b] of moves) play("#board", a, b); };
    build([["e2", "e4"], ["c7", "c5"], ["g1", "f3"]]);
    build([["e2", "e4"], ["e7", "e5"], ["g1", "f3"], ["b8", "c6"], ["f1", "b5"]]);
    build([["e2", "e4"], ["e7", "e6"], ["d2", "d4"]]);
    L("cards: " + Object.keys(G("S").rep.white.cards).length);

    d.querySelector('[data-nav="train"]').click();
    d.querySelector("#tLines").click();
    w.eval("T.lines = 6");
    const T = G("T"), lines = [], answers = { };
    let wrongOnce = false, cur = [];
    for (let guard = 0; guard < 400 && T.state === "run"; guard++) {
      if (T.phase === "move") {
        const n = G("S").rep.white.pos[T.key], fen = G("fenAfter")(G("START"), T.path);
        const c = new (w.Chess)(fen);
        let san = n.m[0];
        if (!wrongOnce && T.path.length === 0) { san = "d4"; wrongOnce = true; } // miss 1.e4 once
        const mv = c.move(san);
        play("#tBoard", mv.from, mv.to);
      }
      if (T.phase === "feedback" && /End of the line/.test(d.querySelector("#tPrompt").textContent)) { lines.push(T.path.join(" ")); while (T.phase === "feedback" && T.state === "run") await sleep(50); }
      await sleep(60);
    }
    L("lines played: " + lines.join(" | "));
    L("branches covered: " + ["e4 c5", "e4 e5", "e4 e6"].filter(b => lines.some(l => l.startsWith(b))).join(", "));
    L("summary: " + d.querySelector("#tSummary").textContent.trim());
    // Practise from here
    d.querySelector('[data-nav="build"]').click();
    w.eval('S.build.white = ["e4","e5"]; renderBuild()');
    const ph = d.querySelector("[data-practicehere]");
    L("build button: " + (ph ? ph.textContent : "none"));
    ph.click();
    for (let g = 0; g < 100 && T.phase !== "move"; g++) await sleep(50);
    L("practice from here starts at: " + T.path.join(" ") + " | root shown: " + (G("practiceRoot")("white").join(" ")));
    d.querySelector("#tStop").click();
    L("DONE");
  }

    const calls = [];

      [after("e4 e5")]: { white: 4800, draws: 1000, black: 4200, moves: [["Nf3", 3500, 700, 2800], ["Nc3", 700, 200, 400], ["Bc4", 300, 50, 150]] },
      [after("e4")]: { white: 4000, draws: 1000, black: 5000, moves: [["e5", 1000, 250, 1250], ["c5", 1600, 400, 2000]] },
    };
    w.fetch = async url => {
      calls.push(Date.now());
      const fen = decodeURIComponent(url.split("fen=")[1]);
      const x = data[G("K")(fen)] || { white: 100, draws: 50, black: 100, moves: [] };
      return { ok: true, status: 200, json: async () => ({ ...x, moves: x.moves.map(([san, w1, d1, b1]) => ({ san, white: w1, draws: d1, black: b1 })) }) };
    };
    w.eval('S.token = "test-token"; S.settings.autoOpp = "off"');
    play("#board", "e2", "e4"); play("#board", "e7", "e5"); play("#board", "g1", "f3");

    L("scan box: " + d.querySelector("#scanBox").textContent.replace(/\s+/g, " ").trim());
    d.querySelector("#scanBox [data-scan]").click();
    const wait = n => {
      if (G("Scan").running && n < 600) return setTimeout(() => wait(n + 1), 100);
      const gaps = calls.slice(1).map((t, i) => t - calls[i]);
      L(`scan done: ${d.querySelector("#scanBox").textContent.replace(/\s+/g, " ").trim()} | requests=${calls.length} min gap=${Math.min(...gaps)}ms`);
      L("sections: " + [...d.querySelectorAll("#sugOut h4")].map(h => h.textContent).join(" / "));
      L("first gem: " + (d.querySelector('#sugOut [data-sug^="gems"]') || {}).textContent);
      // v0.9.10: act on a suggestion without going through Build
      const myAt = () => w.eval('(rep("white").pos[K(fenAfter(START, ["e4","e5"]))] || { m: [] }).m.join(",")');
      L("gem actions: " + [...d.querySelectorAll('#sugOut .sugacts')].map(x => x.textContent.replace(/\s+/g, " ").trim()).join(" / ") + " | my moves: " + myAt());
      const act = t => [...d.querySelectorAll("#sugOut [data-sugact]")].find(b => b.textContent.startsWith(t));
      act("Add as an option").click();
      L("after Add: " + myAt() + " | " + d.querySelector("#sugOut .catwhen").textContent.replace(/\s+/g, " ").trim());
      d.querySelector("#sugOut [data-undo='sug']").click();
      L("after Undo: " + myAt());
      act("Replace").click();
      L("after Replace: " + myAt() + " | Nf3 line pruned: " + !w.eval('rep("white").pos[K(fenAfter(START, ["e4","e5","Nf3"]))]'));
      d.querySelector("#sugOut [data-undo='sug']").click();
      L("after Undo: " + myAt());
      d.querySelector('#sugOut [data-sug^="gems"]').click();
      const rowText = () => [...d.querySelectorAll("#prompt .cand")].map(r => r.querySelector(".crow").textContent.replace(/\s+/g, " ").trim()).join(" | ");
      L("gem opens: view=" + G("S").view + " " + G("S").build.white.join(" ") + " | rows: " + rowText());
      L("arrows at 1.e4 e5: " + [...d.querySelectorAll("#board .arw")].map(a => a.getAttribute("class").split(" ")[1] + ":" + (+a.querySelector("line").getAttribute("stroke-width")).toFixed(2)).join(" "));
      d.querySelector("#back").click();
      L("quick buttons after 1.e4: " + [...d.querySelectorAll("#prompt .quick")].map(b => b.textContent.replace(/\s+/g, " ").trim()).join(" | "));
      L("opponent rows after 1.e4: " + rowText());
      // Gap ›: jumps to the next gap and says which one (the Gaps tab moved to Settings in v0.9.8)
      d.querySelector("#quickGap").click();
      L("after Gap ›: at " + (G("S").build.white.join(" ") || "start"));
      d.querySelector('[data-gapmode="impact"]').click();
      L("rating impact mode: " + G("S").settings.gapRank + " | pressed: " + d.querySelector('[data-gapmode="impact"]').getAttribute("aria-pressed"));
      d.querySelector('[data-gapmode="depth"]').click();
      // My own games from 1.e4 e5 (G1 stats need the game keys worked out first)
      w.eval(`S.games = [["e4 e5 Nf3 Nc6","1-0"],["e4 e5 Nf3 d6","0-1"],["e4 e5 Bc4 Nf6","1-0"]].map(([m, r], i) => ({ id: "y" + i, my: "white", tc: "rapid", result: r, moves: m, white: "me", black: "x" })); S.games.forEach(gameKeys)`);
      w.eval('S.build.white = ["e4","e5"]; renderBuild()');
      L("summary: " + (d.querySelector("#prompt .possum") || {}).textContent);
      L("rows with my games: " + rowText());
      L("arrows with my games: " + [...d.querySelectorAll("#board .arw")].map(a => a.getAttribute("class").split(" ")[1]).join(" "));
      // Tap the Nf3 row (not the move) to expand it
      d.querySelector('#prompt .cand[data-cand="Nf3"] .cst').click();
      const det = d.querySelector('#prompt .cand[data-cand="Nf3"] .cdetail');
      L("expanded Nf3: " + (det ? det.textContent.replace(/\s+/g, " ").trim() : "not expanded") + " | still at: " + G("S").build.white.join(" "));
      const bar = det && det.querySelector("[data-tip]");
      if (bar) { bar.click(); L("tap tip: " + ((d.getElementById("tip") || {}).textContent || "none")); }
      // Auto-play the most common reply after my move
      w.eval('S.settings.autoOpp = "common"; S.build.white = []; renderBuild()');
      play("#board", "e2", "e4");
      L("while the reply is coming: " + d.querySelector("#prompt").textContent.trim() + " | rows: " + d.querySelectorAll("#prompt .cand").length);
      setTimeout(() => {
        L("auto reply after 1.e4: path=" + G("S").build.white.join(" "));
        // v0.9 default: the biggest gap among the replies, leaving out prepared ones (1...e5 is prepared)
        w.eval('removeMove(["e4"], "c5", "white"); walk("white"); S.settings.autoOpp = "gap"; S.build.white = []; renderBuild()');
        play("#board", "e2", "e4");
        setTimeout(() => { L("gap auto reply after 1.e4: path=" + G("S").build.white.join(" ")); L("DONE"); }, 1500);
      }, 1500);
    };
    wait(0);
  }

  // Two first moves for White: add 1.d4 next to 1.e4, then replace 1.d4 with 1.c4, then train
  function runMulti() {
    const start = () => G("S").rep.white.pos[G("K")(G("START"))].m.join(",");
    const btns = () => [...d.querySelectorAll("#prompt button")].map(b => b.textContent).join(" | ");
    play("#board", "e2", "e4"); d.querySelector("#toStart").click();
    play("#board", "d2", "d4");
    L("asked: " + d.querySelector("#prompt .lbl").textContent + " → " + btns());
    d.querySelector("#prompt [data-addopt]").click();
    L("after Add: start moves=" + start() + " path=" + G("S").build.white.join(" "));
    d.querySelector("#toStart").click();
    L("start prompt: " + d.querySelector("#prompt .lbl").textContent + " chips=" + [...d.querySelectorAll("#prompt .chip")].map(c => c.textContent).join(", "));
    play("#board", "c2", "c4");
    d.querySelector('#prompt [data-replace][data-old="d4"]').click();
    L("after Replace d4 with c4: start moves=" + start());
    d.querySelector("#toStart").click();
    play("#board", "g1", "f3"); d.querySelector("#prompt [data-cancel]").click();
    L("after Cancel: start moves=" + start() + " path=" + JSON.stringify(G("S").build.white));
    d.querySelector('[data-nav="train"]').click(); d.querySelector("#tStart").click();
    const T = G("T");
    const wait = n => {
      if (T.phase !== "move") return n > 200 ? L("TIMEOUT") : setTimeout(() => wait(n + 1), 50);
      play("#tBoard", "c2", "c4");
      L("trained start, played c4: " + d.querySelector("#tPrompt").textContent.trim());
      L("DONE");
    };
    wait(0);
  }

  function runTrain() {
    play("#board", "e2", "e4"); play("#board", "e7", "e5"); play("#board", "g1", "f3");
    L("built: " + Object.keys(G("S").rep.white.cards).length + " cards");
    d.querySelector('[data-nav="train"]').click();
    d.querySelector("#tStart").click();
    const T = G("T");
    // Per card: wrong move first, right move after. Keyed by how many moves lead to the position.
    const moves = { 0: { wrong: ["d2", "d4"], right: ["e2", "e4"] }, 2: { wrong: ["b1", "c3"], right: ["g1", "f3"] } };
    const tried = new Set(), seen = [];
    let sawAnim = false, skipped = false, ticks = 0;
    const tick = () => {
      if (++ticks > 400) { L("TIMEOUT phase=" + T.phase); return finish(); }
      if (T.state !== "run") return finish();
      if (T.phase === "anim") {
        sawAnim = true;
        // On the retry of the Nf3 card, tap the board to skip the replay
        if (tried.has(T.key) && !skipped) { d.querySelector("#tBoard").click(); skipped = T.phase === "move"; L("tap skipped the replay: " + skipped); }
      }
      if (T.phase === "move") {
        const m = moves[T.path.length];
        const again = tried.has(T.key);
        seen.push(T.path.length + (again ? "R" : ""));
        tried.add(T.key);
        play("#tBoard", ...(again ? m.right : m.wrong));
        L(`card ${T.path.length ? "after " + T.path.join(" ") : "start"}: played ${again ? "right" : "wrong"} → ${d.querySelector("#tPrompt .lbl").textContent}; queue ${T.queue.length}`);
      }
      setTimeout(tick, 50);
    };
    const finish = () => {
      const cards = Object.values(G("S").rep.white.cards);
      L("order: " + seen.join(" "));
      L("replay seen: " + sawAnim);
      L(`first-attempt grading: done=${T.done} right=${T.right} lapses=${cards.map(c => c.lapses).join(",")} reps=${cards.map(c => c.reps).join(",")}`);
      L("summary: " + d.querySelector("#tSummary").textContent.trim());
      L("DONE");
    };
    tick();
  }
};
</script>
