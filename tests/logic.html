"use strict";
const results = [];
function t(name, fn) {
  try { const r = fn(); results.push((r === false ? "FAIL " : "ok   ") + name); }
  catch (e) { results.push("FAIL " + name + " — " + e.message); }
}
const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || "") + " got " + JSON.stringify(a) + " want " + JSON.stringify(b)); };

const reset = () => { S.books = { main: { white: emptyRep(), black: emptyRep() } }; S.book = "main"; S.rep = S.books.main; S.settings.books = undefined; S.settings.book = undefined; S.games = []; };
const line = (color, moves) => { const p = []; for (const m of moves.split(" ")) { addMove(p, m, color); p.push(m); } walk(color); };

/* ----- job queue (G3): async, so they run last ----- */
async function at(name, fn) {
  try { const r = await fn(); results.push((r === false ? "FAIL " : "ok   ") + name); }
  catch (e) { results.push("FAIL " + name + " — " + e.message); }
}
async function jobTests() {
  const tick = ms => new Promise(r => setTimeout(r, ms));
  await at("jobs: higher priority runs first, then first come first served", async () => {
    const order = [];
    const slow = name => async () => { await tick(5); order.push(name); };
    const all = [Jobs.add("engine", slow("first"), { prio: PRIO.background }), // starts at once
      Jobs.add("engine", slow("bg"), { prio: PRIO.background }), Jobs.add("engine", slow("soon"), { prio: PRIO.soon }),
      Jobs.add("engine", slow("now-a"), { prio: PRIO.now }), Jobs.add("engine", slow("now-b"), { prio: PRIO.now })];
    await Promise.all(all);
    eq(order, ["first", "now-a", "now-b", "soon", "bg"]);
  });
  await at("jobs: same key shares one run, and is upgraded to the higher priority", async () => {
    let runs = 0;
    const block = Jobs.add("engine", () => tick(10));
    const a = Jobs.add("engine", async () => { runs++; return 42; }, { key: "k1", prio: PRIO.background });
    const other = Jobs.add("engine", async () => "other", { prio: PRIO.soon });
    const b = Jobs.add("engine", async () => { runs++; return 0; }, { key: "k1", prio: PRIO.now });
    const order = [];
    a.then(() => order.push("k1")); other.then(() => order.push("other"));
    await Promise.all([block, a, b, other]);
    eq([await a, await b, runs], [42, 42, 1]); eq(order, ["k1", "other"]);
  });
  await at("jobs: stale jobs are skipped when their turn comes", async () => {
    let here = true, ran = false;
    const block = Jobs.add("net", () => tick(10));
    const p = Jobs.add("net", async () => { ran = true; }, { stale: () => !here });
    here = false;
    await block;
    let why = "";
    try { await p; } catch (e) { why = isStale(e) ? "stale" : e.message; }
    eq([ran, why], [false, "stale"]);
  });
  await at("jobs: a shared job stays needed while any requester needs it", async () => {
    let ran = false;
    const block = Jobs.add("net", () => tick(10));
    const a = Jobs.add("net", async () => { ran = true; }, { key: "k2", stale: () => true });
    const b = Jobs.add("net", async () => { ran = true; }, { key: "k2" }); // no stale check: always wanted
    await Promise.all([block, b]);
    eq(ran, true);
  });
  // v0.9.1: build the tree from my games (engine stubbed: Qh5 gives up 2 pawns, everything else 0)
  await at("autobuild: adds my good moves and the common replies, leaves out dubious and losing ones", async () => {
    reset();
    const real = { analyse: Engine.analyse, failed: Engine.failed };
    const bad = K(fenAfter(START, "e4 c5 Qh5".split(" ")));
    Engine.failed = false;
    Engine.analyse = async fen => ({ cp: K(fen) === bad ? 200 : 0, d: 12 });
    try {
      const mk = (moves, result, i) => ({ id: "ab" + i, my: "white", result, moves });
      S.games = [
        ...["1-0", "1-0", "1/2-1/2", "1-0", "0-1"].map((r, i) => mk("e4 e5 Nf3 Nc6 Bc4", r, i)),
        ...["1-0", "1-0", "1-0"].map((r, i) => mk("e4 c5 Qh5 Nc6", r, 10 + i)),
        ...["0-1", "0-1", "0-1"].map((r, i) => mk("e4 e6 d3 d5", r, 20 + i)),
      ];
      const plan = await planAutoBuild("white", { minGames: 3, minScore: 0.45, maxLoss: 70, plies: 20 });
      const str = a => a.path.concat(a.san).join(" ");
      eq(plan.adds.filter(a => a.mine).map(str), ["e4", "e4 e5 Nf3", "e4 e5 Nf3 Nc6 Bc4"]);
      eq(plan.adds.filter(a => !a.mine).map(str), ["e4 e5", "e4 c5", "e4 e6", "e4 e5 Nf3 Nc6"]);
      eq(plan.skipped.map(s => str(s) + ":" + s.why), ["e4 c5 Qh5:engine", "e4 e6 d3:results"]);
      applyAutoBuild(plan);
      eq(rep("white").pos[K(fenAfter(START, ["e4", "e5", "Nf3", "Nc6"]))].m, ["Bc4"]);
      // Run again: what's in the tree is kept and followed, so only new things are proposed
      const again = await planAutoBuild("white", { minGames: 3, minScore: 0.45, maxLoss: 70, plies: 20 });
      eq(again.adds.length, 0);
    } finally { Engine.analyse = real.analyse; Engine.failed = real.failed; S.games = []; }
  });
}

/* ----- gaps: frequency vs rating impact (item 4) ----- */

/* ----- follow-ups: good replies and how often peers find them (item 7) ----- */
t("follow-ups: count good replies from MultiPV, and how often peers find one", () => {
  reset(); resetEx(); S.settings.adv = undefined; // good-move margin 0.5
  const fen = fenOf("e4 e5 Nf3 Nc6 Bc4 Nf6"), p1 = fenAfter(fen, ["Ng5"]);
  const uci = san => { const c = new Chess(p1); const m = c.move(san); return m.from + m.to; };
  // Black to move after 4.Ng5: d5 best, Bc5 close, the rest well behind (cp from Black's side)
  MPV[K(p1)] = { d: 12, n: 5, e: "wasm", lines: [{ uci: uci("d5"), cp: -20 }, { uci: uci("Bc5"), cp: -60 }, { uci: uci("Qe7"), cp: -150 }, { uci: uci("Nxe4"), cp: -220 }, { uci: uci("h6"), cp: -300 }] };
  setEx("e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5", 1000, 500, 50, 450, [mv("d5", 400, 200, 20, 180), mv("Nxe4", 300, 200, 10, 90), mv("Qe7", 200, 80, 10, 110), mv("Bc5", 100, 20, 10, 70)]);
  const fu = followups(fen, "Ng5");
  eq([fu.good, fu.count, fu.label, Math.round(fu.find * 100)], [["d5", "Bc5"], 2, "Narrow", 50]);
  // sound for me (loss 0.2) + narrow + found only 50% of the time = a practical weapon
  eq(isWeapon(fu, { loss: 20 }), true);
  eq(isWeapon(fu, { loss: 120 }), false, "not if it costs me more than the margin");
  eq(isWeapon({ ...fu, find: 0.8 }, { loss: 20 }), false, "not if peers usually find the answer");
  S.settings.adv = { good: 150 };
  eq(followups(fen, "Ng5").label, "Several", "a wider margin counts more replies as good");
  S.settings.adv = undefined; delete MPV[K(p1)];
});

});

});

t("puzzles: queue order is due kept ones, then new, then later; seen ones are retired", () => {
  S.puzzles = { map: {} }; MIST.byGame.clear();
  const { g, a } = shilling(); S.games = [g]; S.acc = { bs: a };
  MIST.byGame.set("bs", gameMistakes(g, a, null));
  PZ.rng = () => 0; // new ones are shuffled, not in date order

/* ----- line practice: choosing replies (items 2 and 3) ----- */
const practiceSetup = () => {
  reset(); resetEx();
  line("white", "e4 c5 Nf3 d6 d4"); line("white", "e4 e5 Nf3 Nc6 Bb5"); line("white", "e4 e6 d4 d5 Nc3");
  setEx("e4", 10000, 4000, 1000, 5000, [mv("c5", 4000, 1600, 400, 2000), mv("e5", 2500, 1000, 250, 1250), mv("e6", 1000, 400, 100, 500)]);
  for (const c of Object.values(rep("white").cards)) Object.assign(c, { reps: 3, lapses: 0, flag: 0, due: Date.now() + 9e8 }); // all known well
  return { fen: fenOf("e4"), key: K(fenOf("e4")), session: { visited: new Set(), recent: {} } };
};
t("practice: replies weighted by how often they're played", () => {
  const { fen, key, session } = practiceSetup(), info = branchInfo("white");
  const w = Object.fromEntries(replyWeights(fen, key, "white", session, info).map(x => [x.san, x.w]));
  eq(w.c5 > w.e5 && w.e5 > w.e6, true, JSON.stringify(w));
});
t("practice: the reply just played is damped, so lines don't repeat back to back", () => {
  const { fen, key, session } = practiceSetup(), info = branchInfo("white");
  const before = replyWeights(fen, key, "white", session, info).find(x => x.san === "c5").w;
  notePick(session, key, "c5");
  const after = replyWeights(fen, key, "white", session, info).find(x => x.san === "c5");
  eq([after.recency, Math.round((after.w / before) * 10) / 10], [0.3, 0.3]);
});
t("practice: a branch that needs work (flagged, due) gets more weight", () => {
  const { fen, key, session } = practiceSetup();
  Object.assign(rep("white").cards[K(fenOf("e4 e6"))], { flag: 2, due: Date.now() - 1 });
  const ws = replyWeights(fen, key, "white", session, branchInfo("white"));
  const e6 = ws.find(x => x.san === "e6"), e5 = ws.find(x => x.san === "e5");
  eq([e6.need > 1, e5.need, e6.w > e5.w], [true, 1, true], JSON.stringify(ws));
});
t("practice: branches already reached this session are boosted less", () => {
  const { fen, key, session } = practiceSetup(), info = branchInfo("white");
  session.visited.add(K(fenOf("e4 c5 Nf3 d6 d4")));
  const ws = Object.fromEntries(replyWeights(fen, key, "white", session, info).map(x => [x.san, x.coverage]));
  eq([ws.c5, ws.e5, ws.e6], [1, 3, 3]);
});
t("practice: over a session every prepared branch comes up", () => {
  const { fen, key, session } = practiceSetup(), info = branchInfo("white");
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const picked = [];
  for (let i = 0; i < 6; i++) {
    const san = pickReply(fen, key, "white", session, info, rnd());
    picked.push(san); notePick(session, key, san);
    for (const l of info[K(fenAfter(fen, [san]))].leaves) session.visited.add(l);
  }
  eq(["c5", "e5", "e6"].every(s => picked.includes(s)), true, picked.join(" "));
  eq(picked.some((s, i) => i && s === picked[i - 1] && s === picked[i - 2]), false, "no reply three times running");
});
