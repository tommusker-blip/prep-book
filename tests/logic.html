/* ----- job queue (G3): async, so they run last ----- */
async function at(name, fn) {
  try { const r = await fn(); results.push((r === false ? "FAIL " : "ok   ") + name); }
  catch (e) { results.push("FAIL " + name + " — " + e.message); }
}
async function jobTests() {
  const tick = ms => new Promise(r => setTimeout(r, ms));
  await at("jobs: higher priority runs first, then first come first served", async () => {
    const order = [];
    const slow = name => async () => { await tick(5); order.push(name); };
    const all = [Jobs.add("engine", slow("first"), { prio: PRIO.background }), // starts at once
      Jobs.add("engine", slow("bg"), { prio: PRIO.background }), Jobs.add("engine", slow("soon"), { prio: PRIO.soon }),
      Jobs.add("engine", slow("now-a"), { prio: PRIO.now }), Jobs.add("engine", slow("now-b"), { prio: PRIO.now })];
    await Promise.all(all);
    eq(order, ["first", "now-a", "now-b", "soon", "bg"]);
  });
  await at("jobs: same key shares one run, and is upgraded to the higher priority", async () => {
    let runs = 0;
    const block = Jobs.add("engine", () => tick(10));
    const a = Jobs.add("engine", async () => { runs++; return 42; }, { key: "k1", prio: PRIO.background });
    const other = Jobs.add("engine", async () => "other", { prio: PRIO.soon });
    const b = Jobs.add("engine", async () => { runs++; return 0; }, { key: "k1", prio: PRIO.now });
    const order = [];
    a.then(() => order.push("k1")); other.then(() => order.push("other"));
    await Promise.all([block, a, b, other]);
    eq([await a, await b, runs], [42, 42, 1]); eq(order, ["k1", "other"]);
  });
  await at("jobs: stale jobs are skipped when their turn comes", async () => {
    let here = true, ran = false;
    const block = Jobs.add("net", () => tick(10));
    const p = Jobs.add("net", async () => { ran = true; }, { stale: () => !here });
    here = false;
    await block;
    let why = "";
    try { await p; } catch (e) { why = isStale(e) ? "stale" : e.message; }
    eq([ran, why], [false, "stale"]);
  });
  await at("jobs: a shared job stays needed while any requester needs it", async () => {
    let ran = false;
    const block = Jobs.add("net", () => tick(10));
    const a = Jobs.add("net", async () => { ran = true; }, { key: "k2", stale: () => true });
    const b = Jobs.add("net", async () => { ran = true; }, { key: "k2" }); // no stale check: always wanted
    await Promise.all([block, b]);
    eq(ran, true);
  });
}

  // After 1.e4, Black plays c5 (40%) or the rare d5 (5%); neither is prepared.
  setEx("e4", 10000, 4000, 1000, 5000, [mv("c5", 4000, 1800, 400, 1800), mv("e5", 2500, 1000, 250, 1250), mv("d5", 500, 150, 30, 320)]);
  // Peers score 50% after c5 but only ~33% after d5; and I've lost all 6 of my games after d5.
  S.games = Array.from({ length: 6 }, (_, i) => ({ id: "d" + i, my: "white", result: "0-1", moves: "e4 d5 exd5 Qxd5" }));
  S.games.forEach(gameKeys);
  S.settings.gapMode = "freq";
  const byFreq = rankedGaps("white").filter(g => g.opp).map(g => g.opp);
  S.settings.gapMode = "impact";
  const byImpact = rankedGaps("white").filter(g => g.opp).map(g => g.opp);
  eq(byFreq.slice(0, 2), ["c5", "d5"], "frequency: c5 first");
  eq(byImpact[0], "d5", "rating impact: d5 first");
  const d5 = rankedGaps("white").find(g => g.opp === "d5");
  eq([d5.basis, Math.round(d5.expected * 100)], ["your 6 games + peer data", 21]); // (6×0 + 10×0.33)/16 ≈ 0.21
  S.settings.gapMode = undefined; S.games = []; GAMEKEYS.clear();
});
t("gaps: a prepared position I keep losing is a weak spot, in rating-impact mode only", () => {
  reset(); resetEx(); GAMEKEYS.clear(); S.settings.adv = undefined;
  line("white", "e4 e5 Nf3 Nc6 Bc4");
  S.games = Array.from({ length: 5 }, (_, i) => ({ id: "w" + i, my: "white", result: i ? "0-1" : "1/2-1/2", moves: "e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5" }));
  S.games.forEach(gameKeys);
  S.settings.gapMode = "impact";
  const weak = rankedGaps("white").filter(g => g.weak).map(g => g.text);
  eq(weak.includes("Weak spot: you score 10% here"), true, JSON.stringify(weak));
  S.settings.gapMode = "freq";
  eq(rankedGaps("white").some(g => g.weak), false, "not in frequency mode");
  S.settings.gapMode = undefined; S.games = []; GAMEKEYS.clear();
});
t("gaps: Next gap steps through the list and wraps round", () => {
  const list = [{ id: "a" }, { id: "b" }, { id: "c" }];
  gapLast = null; eq(nextGapTarget(list).id, "a");
  gapLast = "a"; eq(nextGapTarget(list).id, "b");
  gapLast = "c"; eq(nextGapTarget(list).id, "a");
  gapLast = "gone"; eq(nextGapTarget(list).id, "a", "a gap that was filled starts again from the top");
  gapLast = null;
});

  document.getElementById("out").textContent = results.join("\n") + `\n\n${results.filter(r => r.startsWith("ok")).length} passed, ${fails} failed`;
  document.title = fails ? "FAIL" : "PASS";
});
